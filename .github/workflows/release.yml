name: Release

# Configure Trusted Publishing for this workflow on crates.io and npm before
# pushing a release tag.

on:
  push:
    tags:
      - "v*.*.*"
      - "*.*.*"

permissions:
  contents: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish crates.io and npm packages
    runs-on: ubuntu-latest

    env:
      CARGO_TERM_COLOR: always

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy --component rustfmt
          rustup default stable
          rustup target add wasm32-unknown-unknown

      - name: Cache Cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-release-
            ${{ runner.os }}-cargo-

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Check tag matches crate version
        run: |
          crate_version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          tag_version="${GITHUB_REF_NAME#v}"

          if [ "$crate_version" != "$tag_version" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${crate_version}"
            exit 1
          fi

      - name: Install wasm-pack
        run: cargo install wasm-pack --version 0.14.0 --locked

      - name: Install npm dependencies
        run: npm ci

      - name: Check formatting
        run: cargo fmt --check

      - name: Run Clippy
        run: cargo clippy --all-targets --features wasm -- -D warnings

      - name: Run Rust tests
        run: cargo test

      - name: Run Rust tests with wasm feature
        run: cargo test --features wasm

      - name: Run TypeScript runtime test
        run: npm run test:ts

      - name: Build npm package
        run: wasm-pack build --release --target bundler --scope necocen --features wasm

      - name: Check npm package metadata
        run: >
          node -e 'const pkg = require("./pkg/package.json");
          const tagVersion = process.env.GITHUB_REF_NAME.replace(/^v/, "");
          if (pkg.name !== "@necocen/piyoparse") throw new Error(`unexpected package name: ${pkg.name}`);
          if (pkg.version !== tagVersion) throw new Error(`npm package version ${pkg.version} does not match tag ${process.env.GITHUB_REF_NAME}`);'

      - name: Authenticate to crates.io
        id: crates_io_auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish crates.io package
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates_io_auth.outputs.token }}

      - name: Publish npm package
        run: npm publish ./pkg --access public

      - name: Create GitHub Release
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
